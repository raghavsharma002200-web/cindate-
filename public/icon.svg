<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Option 2: 3D Glossy Liquid Glass) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="40%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#8E2DE2"/>
    </linearGradient>
    
    <!-- Top Glass Highlight -->
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FFE4EE"/>
    </linearGradient>

    <!-- Play Icon Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <!-- Deep Drop Shadow for 3D Float -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#4A0E2E" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glass Sheen Overlay -->
  <rect width="512" height="260" rx="115" fill="url(#glassLight)"/>

  <!-- Cinema Reel / Sparkle Stars -->
  <circle cx="110" cy="120" r="9" fill="#ffffff" opacity="0.6"/>
  <circle cx="390" cy="140" r="7" fill="#ffffff" opacity="0.5"/>
  <circle cx="410" cy="380" r="8" fill="#ffffff" opacity="0.4"/>
  <circle cx="120" cy="390" r="6" fill="#ffffff" opacity="0.4"/>

  <!-- 3D Frosted Liquid Heart -->
  <path d="M256 425 C130 330 80 230 155 170 C205 130 240 160 256 185 C272 160 307 130 357 170 C432 230 382 330 256 425 Z" 
        fill="url(#heartGrad)" 
        filter="url(#shadow3D)"/>

  <!-- Inner Clapper/Play Heart Layer -->
  <path d="M245 220 L315 264 L245 308 Z" fill="url(#playGrad)" filter="url(#shadow3D)"/>
  
  <!-- Subtle cinema clapper tick marks on top lobes -->
  <rect x="180" y="160" width="12" height="24" rx="4" transform="rotate(-25 180 160)" fill="#ffffff" opacity="0.85"/>
  <rect x="220" y="148" width="12" height="24" rx="4" transform="rotate(-10 220 148)" fill="#ffffff" opacity="0.85"/>
  <rect x="280" y="148" width="12" height="24" rx="4" transform="rotate(10 280 148)" fill="#ffffff" opacity="0.85"/>
  <rect x="320" y="160" width="12" height="24" rx="4" transform="rotate(25 320 160)" fill="#ffffff" opacity="0.85"/>
</svg>